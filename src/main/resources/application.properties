spring.application.name=vozpublica

spring.datasource.url=jdbc:postgresql://localhost:5432/vozpublica
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB
app.upload.dir=${UPLOAD_DIR:uploads}

app.base-url=http://localhost:8080
app.email.verificacao-obrigatoria=true
app.mail.from=nao-responder@vozpublica.local
# SOMENTE desenvolvimento: sem SMTP, escreve o e-mail (com o link) no console
app.mail.log-conteudo=true
# Opcional, para ver os e-mails numa caixa local (Mailpit: SMTP 1025, painel em http://localhost:8025):
# spring.mail.host=localhost
# spring.mail.port=1025