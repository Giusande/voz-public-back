<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Voz Pública</title>
</head>
<body>
    <h1 th:text="${mensagem}">Mensagem</h1>

    <div th:if="${usuario == null}">
        <a th:href="@{/login}">Entrar</a> | <a th:href="@{/cadastro}">Cadastrar</a>
    </div>

    <div th:if="${usuario != null}">
        <p>Olá, <span th:text="${usuario}"></span>!</p>
        <form th:action="@{/logout}" method="post">
            <button type="submit">Sair</button>
        </form>
    </div>
</body>
</html>
