<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recuperar senha - Voz Pública</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div th:replace="~{menu-fragmento :: menu}"></div>
    <main class="container" style="max-width: 460px">
      <h1 class="h4 mb-3">Recuperar senha</h1>

      <div class="alert alert-success" th:if="${param.enviado}">
        Se existir uma conta com esse e-mail, enviamos um link para criar uma
        nova senha. Ele vale por 1 hora. Confira também a caixa de spam.
      </div>

      <form th:action="@{/recuperar-senha}" method="post">
        <div class="mb-3">
          <label for="email" class="form-label">E-mail da sua conta</label>
          <input
            type="email"
            id="email"
            name="email"
            maxlength="150"
            class="form-control"
            required
            autofocus
          />
        </div>
        <button type="submit" class="btn btn-primary">Enviar link</button>
        <a th:href="@{/login}" class="btn btn-link">Voltar ao login</a>
      </form>
    </main>
  </body>
</html>
