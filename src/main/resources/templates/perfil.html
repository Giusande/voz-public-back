<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="${p.usuario().nomeExibicao} + ' - Voz Pública'">
      Perfil
    </title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div th:replace="~{menu-fragmento :: menu}"></div>

    <main
      class="container pb-4"
      style="max-width: 720px"
      th:with="page=${p.publicacoes().page()}"
    >
      <div
        class="alert alert-warning"
        th:if="${p.dono() and !p.usuario().perfilPublico}"
      >
        Seu perfil está <strong>privado</strong>: só você vê esta página.
      </div>

      <h1 class="h3" th:text="${p.usuario().nomeExibicao}">Nome</h1>

      <p class="text-muted mb-1" th:if="${p.membroDesde() != null}">
        <span
          th:text="'Membro desde ' + ${#temporals.format(p.membroDesde(), 'dd/MM/yyyy')}"
          >Membro desde</span
        >
        <span
          class="badge text-bg-light border"
          th:if="${p.dono() and !p.usuario().exibirDataCadastro}"
          >só você vê</span
        >
      </p>
      <p class="text-muted mb-1" th:if="${p.apoios() != null}">
        <span th:text="${p.apoios()} + ' ocorrência(s) apoiada(s)'"
          >apoios</span
        >
        <span
          class="badge text-bg-light border"
          th:if="${p.dono() and !p.usuario().exibirApoios}"
          >só você vê</span
        >
      </p>

      <div class="d-flex gap-2 my-3" th:if="${p.dono()}">
        <a
          th:href="@{/perfil/configuracoes}"
          class="btn btn-outline-secondary btn-sm"
          >Privacidade</a
        >
        <a
          th:href="@{/minhas-denuncias}"
          class="btn btn-outline-secondary btn-sm"
          >Minhas denúncias</a
        >
      </div>

      <h2 class="h5 mt-4">Publicações</h2>
      <p class="text-muted" th:if="${page.empty}">Nenhuma publicação.</p>

      <article class="card mb-3 shadow-sm" th:each="d : ${page.content}">
        <div class="card-body">
          <div class="d-flex flex-wrap gap-1 mb-2">
            <span
              class="badge"
              th:classappend="${d.status.classeCor}"
              th:text="${d.status.rotulo}"
              >Situação</span
            >
            <span
              class="badge text-bg-light border"
              th:text="${d.categoria.nome}"
              >Categoria</span
            >
          </div>
          <h3 class="h6 mb-1">
            <a
              th:href="@{/denuncias/{id}(id=${d.id})}"
              class="text-decoration-none"
              th:text="${d.titulo}"
              >Título</a
            >
          </h3>
          <p class="small text-muted mb-1">
            <span th:text="${d.bairro}">Bairro</span> ·
            <span th:text="${#temporals.format(d.dataCriacao, 'dd/MM/yyyy')}"
              >data</span
            >
          </p>
          <p
            class="small mb-0"
            th:text="${p.publicacoes().contadores().get(d.id).curtidas()} + ' curtidas · '
                      + ${p.publicacoes().contadores().get(d.id).incentivos()} + ' incentivos · '
                      + ${p.publicacoes().contadores().get(d.id).comentarios()} + ' comentários'"
          >
            contadores
          </p>
        </div>
      </article>

      <nav
        class="d-flex justify-content-between"
        th:if="${page.totalPages > 1}"
      >
        <a
          class="btn btn-outline-secondary btn-sm"
          th:if="${page.hasPrevious()}"
          th:href="@{/perfil/{id}(id=${p.usuario().id}, pagina=${page.number - 1})}"
          >&laquo; Anteriores</a
        >
        <span th:unless="${page.hasPrevious()}"></span>
        <span
          class="text-muted small align-self-center"
          th:text="'Página ' + ${page.number + 1} + ' de ' + ${page.totalPages}"
          >Página</span
        >
        <a
          class="btn btn-outline-secondary btn-sm"
          th:if="${page.hasNext()}"
          th:href="@{/perfil/{id}(id=${p.usuario().id}, pagina=${page.number + 1})}"
          >Próximas &raquo;</a
        >
        <span th:unless="${page.hasNext()}"></span>
      </nav>
    </main>
  </body>
</html>
