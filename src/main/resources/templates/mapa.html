<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mapa - Voz Pública</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"
    />
  </head>
  <body class="bg-light">
    <div th:replace="~{menu-fragmento :: menu}"></div>

    <main class="container pb-4" style="max-width: 1100px">
      <h1 class="h4 mb-3">Mapa de ocorrências</h1>

      <form id="filtros" class="card card-body mb-3">
        <div class="row g-2">
          <div class="col-sm-6 col-md-3">
            <label for="f-categoria" class="form-label small mb-1"
              >Categoria</label
            >
            <select
              id="f-categoria"
              name="categoriaId"
              class="form-select form-select-sm"
            >
              <option value="">Todas</option>
              <option
                th:each="c : ${categorias}"
                th:value="${c.id}"
                th:text="${c.nome}"
              ></option>
            </select>
          </div>
          <div class="col-sm-6 col-md-3">
            <label for="f-status" class="form-label small mb-1">Situação</label>
            <select
              id="f-status"
              name="status"
              class="form-select form-select-sm"
            >
              <option value="">Todas</option>
              <option
                th:each="s : ${statuses}"
                th:value="${s}"
                th:text="${s.rotulo}"
              ></option>
            </select>
          </div>
          <div class="col-sm-6 col-md-3">
            <label for="f-bairro" class="form-label small mb-1">Bairro</label>
            <input
              type="text"
              id="f-bairro"
              name="bairro"
              maxlength="100"
              class="form-control form-control-sm"
            />
          </div>
          <div class="col-sm-6 col-md-3">
            <label for="f-prioridade" class="form-label small mb-1"
              >Prioridade</label
            >
            <select
              id="f-prioridade"
              name="prioridade"
              class="form-select form-select-sm"
            >
              <option value="">Todas</option>
              <option
                th:each="p : ${prioridades}"
                th:value="${p}"
                th:text="${p}"
              ></option>
            </select>
          </div>
        </div>
        <div class="mt-2 d-flex gap-2 align-items-center">
          <button type="submit" class="btn btn-primary btn-sm">Filtrar</button>
          <button type="button" id="limpar" class="btn btn-link btn-sm">
            Limpar
          </button>
          <span id="resumo" class="small text-muted" aria-live="polite"></span>
        </div>
      </form>

      <div
        id="mapa"
        th:data-dados="@{/mapa/dados}"
        th:data-detalhe="@{/denuncias/}"
        style="height: 520px"
        class="border rounded"
        role="region"
        aria-label="Mapa com as ocorrências registradas"
      ></div>
      <p class="small text-muted mt-2">
        Aparecem só as ocorrências registradas com localização. Ocultas e
        duplicadas ficam de fora. A prioridade considerada é a oficial, quando
        existir; senão, a sugerida pelo cidadão.
      </p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      (function () {
        var el = document.getElementById("mapa");
        var urlDados = el.getAttribute("data-dados");
        var urlDetalhe = el.getAttribute("data-detalhe");
        var resumo = document.getElementById("resumo");

        // centro do Recife
        var mapa = L.map("mapa").setView([-8.0476, -34.877], 12);
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution:
            '&copy; <a href="https://www.openstreetmap.org/copyright">Colaboradores do OpenStreetMap</a>',
        }).addTo(mapa);

        var camada = L.layerGroup().addTo(mapa);

        function popup(m) {
          var caixa = document.createElement("div");
          var titulo = document.createElement("strong");
          titulo.textContent = m.titulo;
          var linha = document.createElement("div");
          linha.textContent = m.categoria + " · " + m.situacao;
          var local = document.createElement("div");
          local.textContent = m.bairro;
          var link = document.createElement("a");
          link.href = urlDetalhe + encodeURIComponent(m.id);
          link.textContent = "Ver ocorrência";
          caixa.appendChild(titulo);
          caixa.appendChild(linha);
          caixa.appendChild(local);
          caixa.appendChild(link);
          return caixa;
        }

        function carregar() {
          var params = new URLSearchParams();
          new FormData(document.getElementById("filtros")).forEach(
            function (valor, nome) {
              if (valor !== "") params.set(nome, valor);
            },
          );
          resumo.textContent = "Carregando...";
          fetch(urlDados + "?" + params.toString(), {
            credentials: "same-origin",
          })
            .then(function (r) {
              if (!r.ok) throw new Error();
              return r.json();
            })
            .then(function (dados) {
              camada.clearLayers();
              var pontos = [];
              dados.marcadores.forEach(function (m) {
                L.marker([m.lat, m.lng]).bindPopup(popup(m)).addTo(camada);
                pontos.push([m.lat, m.lng]);
              });
              if (pontos.length > 0)
                mapa.fitBounds(pontos, { padding: [30, 30], maxZoom: 16 });
              resumo.textContent =
                dados.marcadores.length +
                " ocorrência(s) no mapa" +
                (dados.truncado
                  ? " (mostrando as mais recentes; refine os filtros)"
                  : "");
            })
            .catch(function () {
              resumo.textContent = "Não foi possível carregar o mapa.";
            });
        }

        document
          .getElementById("filtros")
          .addEventListener("submit", function (e) {
            e.preventDefault();
            carregar();
          });
        document
          .getElementById("limpar")
          .addEventListener("click", function () {
            document.getElementById("filtros").reset();
            carregar();
          });
        carregar();
      })();
    </script>
  </body>
</html>
