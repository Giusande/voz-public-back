
<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Notificações - Voz Pública</title>

    <th:block th:replace="~{layout-fragmentos :: headComum('Notificações')}"></th:block>

    <!-- Layout específico da página -->
    <style>
      .vp-grid--gestao {
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
        gap: 24px;
        align-items: start;
        width: 100%;
      }

      .vp-grid--gestao > :first-child {
        position: sticky;
        top: 16px;
        align-self: start;
        min-width: 0;
        max-height: calc(100vh - 32px);
        overflow-y: auto;
      }

      .vp-grid--gestao > main {
        min-width: 0;
        width: 100%;
        max-width: 1100px;
        padding-right: 24px;
      }

      @media (max-width: 991px) {
        .vp-grid--gestao {
          grid-template-columns: minmax(0, 1fr);
          gap: 0;
        }

        .vp-grid--gestao > :first-child {
          position: static;
          max-height: none;
          overflow: visible;
        }

        .vp-grid--gestao > main {
          padding: 16px;
          max-width: 100%;
        }
      }
    </style>
  </head>

  <body class="bg-light">

    <!-- TOPBAR -->
    <div th:replace="~{layout-fragmentos :: topbar(true)}"></div>

    <!-- LAYOUT PRINCIPAL -->
    <div class="vp-grid vp-grid--3">

      <!-- SIDEBAR -->
      <div th:replace="~{layout-fragmentos :: sidebar(true, 'notificacoes', '')}"></div>

      <!-- CONTEÚDO PRINCIPAL -->
      <main class="py-4" >

        <!-- CABEÇALHO -->
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">

          <h1 class="h4 m-0">Notificações</h1>

          <form
            th:action="@{/notificacoes/lidas}"
            method="post"
          >
            <button
              type="submit"
              class="btn btn-outline-secondary btn-sm"
            >
              Marcar todas como lidas
            </button>
          </form>

        </div>

        <!-- ESTADO VAZIO -->
        <p class="text-muted" th:if="${page.empty}">
          Nenhuma notificação.
        </p>

        <!-- LISTAGEM DE NOTIFICAÇÕES -->
        <div
          class="card mb-2"
          th:each="n : ${page.content}"
          th:classappend="${!n.lida} ? 'border-primary'"
        >

          <div class="card-body py-2">

            <!-- TIPO E DATA -->
            <div class="small text-muted mb-1">

              <span
                class="badge text-bg-secondary"
                th:text="${n.tipo.rotulo}"
              >
                Tipo
              </span>

              <span
                th:text="${#temporals.format(n.dataCriacao, 'dd/MM/yyyy HH:mm')}"
              >
                data
              </span>

              <span
                class="badge text-bg-primary"
                th:if="${!n.lida}"
              >
                Nova
              </span>

            </div>

            <!-- MENSAGEM -->
            <div
              style="white-space: pre-line"
              th:text="${n.mensagem}"
            >
              Mensagem
            </div>

            <!-- AÇÕES -->
            <div class="mt-2 d-flex gap-2 flex-wrap">

              <a
                th:href="@{${n.tipo.caminho(n.denunciaId)}}"
                class="btn btn-outline-primary btn-sm"
              >
                Abrir
              </a>

              <form
                th:if="${!n.lida}"
                th:action="@{/notificacoes/{id}/lida(id=${n.id})}"
                method="post"
              >
                <button
                  type="submit"
                  class="btn btn-outline-secondary btn-sm"
                >
                  Marcar como lida
                </button>
              </form>

            </div>

          </div>
        </div>

        <!-- PAGINAÇÃO -->
        <nav
          class="d-flex justify-content-between align-items-center mt-3"
          th:if="${page.totalPages > 1}"
        >

          <a
            class="btn btn-outline-secondary btn-sm"
            th:if="${page.hasPrevious()}"
            th:href="@{/notificacoes(pagina=${page.number - 1})}"
          >
            &laquo; Anteriores
          </a>

          <span th:unless="${page.hasPrevious()}"></span>

          <span
            class="text-muted small align-self-center"
            th:text="'Página ' + ${page.number + 1} + ' de ' + ${page.totalPages}"
          >
            Página
          </span>

          <a
            class="btn btn-outline-secondary btn-sm"
            th:if="${page.hasNext()}"
            th:href="@{/notificacoes(pagina=${page.number + 1})}"
          >
            Próximas &raquo;
          </a>

          <span th:unless="${page.hasNext()}"></span>

        </nav>

      </main>

    </div>

  </body>
</html>
