<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notificações - Voz Pública</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div th:replace="~{menu-fragmento :: menu}"></div>

    <main class="container pb-4" style="max-width: 720px">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 m-0">Notificações</h1>
        <form th:action="@{/notificacoes/lidas}" method="post">
          <button type="submit" class="btn btn-outline-secondary btn-sm">
            Marcar todas como lidas
          </button>
        </form>
      </div>

      <p class="text-muted" th:if="${page.empty}">Nenhuma notificação.</p>

      <div
        class="card mb-2"
        th:each="n : ${page.content}"
        th:classappend="${!n.lida} ? 'border-primary'"
      >
        <div class="card-body py-2">
          <div class="small text-muted mb-1">
            <span class="badge text-bg-secondary" th:text="${n.tipo.rotulo}"
              >Tipo</span
            >
            <span
              th:text="${#temporals.format(n.dataCriacao, 'dd/MM/yyyy HH:mm')}"
              >data</span
            >
            <span class="badge text-bg-primary" th:if="${!n.lida}">Nova</span>
          </div>
          <div style="white-space: pre-line" th:text="${n.mensagem}">
            Mensagem
          </div>
          <div class="mt-2 d-flex gap-2">
            <a
              th:href="@{${n.tipo.caminho(n.denunciaId)}}"
              class="btn btn-outline-primary btn-sm"
              >Abrir</a
            >
            <form
              th:if="${!n.lida}"
              th:action="@{/notificacoes/{id}/lida(id=${n.id})}"
              method="post"
            >
              <button type="submit" class="btn btn-outline-secondary btn-sm">
                Marcar como lida
              </button>
            </form>
          </div>
        </div>
      </div>

      <nav
        class="d-flex justify-content-between"
        th:if="${page.totalPages > 1}"
      >
        <a
          class="btn btn-outline-secondary btn-sm"
          th:if="${page.hasPrevious()}"
          th:href="@{/notificacoes(pagina=${page.number - 1})}"
          >&laquo; Anteriores</a
        >
        <span th:unless="${page.hasPrevious()}"></span>
        <span
          class="text-muted small align-self-center"
          th:text="'Página ' + ${page.number + 1} + ' de ' + ${page.totalPages}"
          >Página</span
        >
        <a
          class="btn btn-outline-secondary btn-sm"
          th:if="${page.hasNext()}"
          th:href="@{/notificacoes(pagina=${page.number + 1})}"
          >Próximas &raquo;</a
        >
        <span th:unless="${page.hasNext()}"></span>
      </nav>
    </main>
  </body>
</html>
