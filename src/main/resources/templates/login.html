<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar - Voz Pública</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container" style="max-width: 420px; margin-top: 60px;">
    <h1 class="h3 mb-4">Entrar no Voz Pública</h1>

    <div class="alert alert-success" th:if="${param.registered}">Cadastro realizado! Faça login.</div>
    <div class="alert alert-danger" th:if="${param.error}">E-mail ou senha inválidos.</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">E-mail</label>
            <input type="email" id="username" name="username" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Senha</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Entrar</button>
    </form>

    <p class="mt-3 text-center">Ainda não tem conta? <a th:href="@{/cadastro}">Cadastre-se</a></p>
</main>
</body>
</html>
