<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{layout-fragmentos :: headComum('Auditoria')}"></th:block>
    <style th:replace="~{gestao-fragmentos :: estiloGestao}"></style>
</head>
<body>
<div th:replace="~{menu-fragmento :: menuEquipe}"></div>

<main class="gp">
    <div class="gp-cab">
        <span class="gp-cab__ic ic-cinza"><i class="bi bi-clock-history"></i></span>
        <div>
            <h1>Auditoria</h1>
            <p><b th:text="${page.totalElements}">0</b> registro(s). Somente leitura: não podem ser editados nem apagados.</p>
        </div>
    </div>

    <details class="gp-card gp-filtro"
             th:attr="open=${filtro.acao != null or filtro.responsavel != null or filtro.de != null or filtro.ate != null} ? 'open'">
        <summary><i class="bi bi-funnel-fill text-primary"></i> Filtros <i class="bi bi-chevron-down vp-seta"></i></summary>
        <form th:action="@{/admin/auditoria}" method="get" class="mt-3">
            <div class="row g-2">
                <div class="col-md-3">
                    <label for="f-acao" class="form-label small mb-1">Ação</label>
                    <select id="f-acao" name="acao" class="form-select form-select-sm">
                        <option value="">Todas</option>
                        <option th:each="a : ${acoes}" th:value="${a}" th:text="${a.rotulo}"
                                th:selected="${a == filtro.acao}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="f-resp" class="form-label small mb-1">E-mail do responsável</label>
                    <input type="text" id="f-resp" name="responsavel" maxlength="150"
                           class="form-control form-control-sm" th:value="${filtro.responsavel}">
                </div>
                <div class="col-md-3">
                    <label for="f-de" class="form-label small mb-1">De</label>
                    <input type="date" id="f-de" name="de" class="form-control form-control-sm" th:value="${filtro.de}">
                </div>
                <div class="col-md-3">
                    <label for="f-ate" class="form-label small mb-1">Até</label>
                    <input type="date" id="f-ate" name="ate" class="form-control form-control-sm" th:value="${filtro.ate}">
                </div>
            </div>
            <div class="mt-3 d-flex gap-2">
                <button type="submit" class="vp-btn vp-btn--pri"><i class="bi bi-check2"></i> Filtrar</button>
                <a th:href="@{/admin/auditoria}" class="vp-btn">Limpar</a>
            </div>
        </form>
    </details>

    <div class="gp-card gp-vazio" th:if="${page.empty}">
        <i class="bi bi-inbox"></i>
        Nenhum registro encontrado.
    </div>

    <div class="gp-card p-0" th:if="${!page.empty}">
        <div class="gp-rolagem" style="max-height:72vh;overflow-y:auto">
            <table class="gp-tabela">
                <thead>
                <tr><th>Data</th><th>Responsável</th><th>Ação</th><th>Alvo</th><th>Justificativa</th><th>Detalhes</th></tr>
                </thead>
                <tbody>
                <tr th:each="r : ${page.content}">
                    <td class="small" style="white-space:nowrap"
                        th:text="${#temporals.format(r.dataAcao, 'dd/MM/yyyy HH:mm')}">data</td>
                    <td>
                        <div class="fw-semibold" th:text="${r.responsavel.name}">Nome</div>
                        <div class="small text-muted" th:text="${r.responsavel.email}">email</div>
                    </td>
                    <td><span class="gp-chip gp-chip--azul" th:text="${r.acao.rotulo}">Ação</span></td>
                    <td class="small" th:text="${r.entidade} + (${r.entidadeId} != null ? ' #' + ${r.entidadeId} : '')">alvo</td>
                    <td class="small" th:text="${r.justificativa}" style="white-space:pre-line">justificativa</td>
                    <td class="small" th:text="${r.detalhes}" style="white-space:pre-line">detalhes</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-3">
        <nav th:replace="~{layout-fragmentos :: paginacao(${page}, ${'/admin/auditoria?' + filtro.queryString(page.number - 1)}, ${'/admin/auditoria?' + filtro.queryString(page.number + 1)})}"></nav>
    </div>
</main>
</body>
</html>
