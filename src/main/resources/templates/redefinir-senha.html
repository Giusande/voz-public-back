<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Nova senha - Voz Pública</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div th:replace="~{menu-fragmento :: menu}"></div>
    <main class="container" style="max-width: 460px">
      <h1 class="h4 mb-3">Criar nova senha</h1>

      <div class="alert alert-danger" th:if="${!tokenValido}">
        Este link é inválido ou expirou.
        <a th:href="@{/recuperar-senha}">Peça um novo</a>.
      </div>

      <form
        th:if="${tokenValido}"
        th:action="@{/redefinir-senha}"
        th:object="${form}"
        method="post"
        novalidate
      >
        <input type="hidden" th:field="*{token}" />
        <div class="mb-3">
          <label for="password" class="form-label"
            >Nova senha (mínimo 8 caracteres)</label
          >
          <input
            type="password"
            id="password"
            th:field="*{password}"
            class="form-control"
            th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
            autocomplete="new-password"
          />
          <div class="invalid-feedback" th:errors="*{password}"></div>
        </div>
        <div class="mb-3">
          <label for="confirmPassword" class="form-label"
            >Confirmar nova senha</label
          >
          <input
            type="password"
            id="confirmPassword"
            th:field="*{confirmPassword}"
            class="form-control"
            th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
            autocomplete="new-password"
          />
          <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
        </div>
        <button type="submit" class="btn btn-primary">Salvar nova senha</button>
      </form>
    </main>
  </body>
</html>
