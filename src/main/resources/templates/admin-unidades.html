<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unidades - Voz Pública</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4" style="max-width: 900px;">
    <h1 class="h4 mb-3">Unidades responsáveis</h1>

    <div class="alert alert-success" th:if="${mensagem}" th:text="${mensagem}"></div>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

    <form th:action="@{/admin/unidades}" method="post" class="card card-body mb-4">
        <h2 class="h6">Nova unidade</h2>
        <div class="row g-2">
            <div class="col-md-5">
                <label for="nome" class="form-label">Nome</label>
                <input type="text" id="nome" name="nome" maxlength="120" class="form-control" required>
            </div>
            <div class="col-md-3">
                <label for="tipo" class="form-label">Tipo</label>
                <select id="tipo" name="tipo" class="form-select" required>
                    <option value="">Selecione...</option>
                    <option th:each="t : ${tipos}" th:value="${t}" th:text="${t.rotulo}"></option>
                </select>
            </div>
            <div class="col-md-4">
                <label for="paiId" class="form-label">Unidade superior</label>
                <select id="paiId" name="paiId" class="form-select">
                    <option value="">Nenhuma</option>
                    <option th:each="p : ${pais}" th:value="${p.id}"
                            th:text="${p.tipo.rotulo + ': ' + p.nome}"></option>
                </select>
            </div>
        </div>
        <div class="form-text mt-2">
            Secretaria e Órgão ficam no topo. Departamento fica abaixo de Secretaria ou Órgão.
            Equipe fica abaixo de qualquer um dos três.
        </div>
        <button type="submit" class="btn btn-primary mt-3 align-self-start">Cadastrar</button>
    </form>

    <p class="text-muted" th:if="${unidades.empty}">Nenhuma unidade cadastrada ainda.</p>
    <table class="table table-sm align-middle bg-white" th:if="${!unidades.empty}">
        <thead><tr><th>Nome</th><th>Tipo</th><th>Superior</th><th>Situação</th><th></th></tr></thead>
        <tbody>
        <tr th:each="u : ${unidades}">
            <td th:text="${u.nome}">Nome</td>
            <td th:text="${u.tipo.rotulo}">Tipo</td>
            <td th:text="${u.pai != null ? u.pai.nome : '—'}">Superior</td>
            <td>
                <span class="badge text-bg-success" th:if="${u.ativa}">Ativa</span>
                <span class="badge text-bg-secondary" th:unless="${u.ativa}">Desativada</span>
            </td>
            <td>
                <form th:action="@{/admin/unidades/{id}/ativa(id=${u.id})}" method="post">
                    <button type="submit" class="btn btn-outline-secondary btn-sm"
                            th:text="${u.ativa} ? 'Desativar' : 'Reativar'">Alternar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
