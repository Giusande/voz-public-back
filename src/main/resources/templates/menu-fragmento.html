<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <body>
    <nav
      th:fragment="menu"
      class="bg-white border-bottom mb-3"
      aria-label="Navegação principal"
    >
      <div
        class="container py-2 d-flex flex-wrap align-items-center justify-content-between gap-2"
        style="max-width: 1100px"
      >
        <a th:href="@{/}" class="fw-bold text-decoration-none">Voz Pública</a>

        <div class="d-flex flex-wrap align-items-center gap-1">
          <a th:href="@{/denuncias}" class="btn btn-sm btn-outline-secondary"
            >Ocorrências</a
          >
          <a th:href="@{/denuncias/nova}" class="btn btn-sm btn-outline-primary"
            >Registrar ocorrência</a
          >
          <a
            th:if="${navLogado}"
            th:href="@{/minhas-denuncias}"
            class="btn btn-sm btn-outline-secondary"
            >Minhas denúncias</a
          >
          <a
            th:if="${navLogado}"
            th:href="@{/notificacoes}"
            class="btn btn-sm btn-outline-secondary"
            >Notificações
            <span
              th:if="${navNaoLidas.total > 0}"
              id="nav-nao-lidas"
              class="badge text-bg-danger"
              th:text="${navNaoLidas.total}"
              >0</span
            ></a
          >
          <a
            th:if="${navLogado}"
            th:href="@{/perfil}"
            class="btn btn-sm btn-outline-secondary"
            >Meu perfil</a
          >

          <span class="vr mx-1 d-none d-md-block" th:if="${navEquipe}"></span>
          <a
            th:if="${navEquipe}"
            th:href="@{/gestao/dashboard}"
            class="btn btn-sm btn-outline-secondary"
            >Dashboard</a
          >
          <a
            th:if="${navEquipe}"
            th:href="@{/gestao/relatorios}"
            class="btn btn-sm btn-outline-secondary"
            >Relatórios</a
          >
          <a
            th:if="${navEquipe}"
            th:href="@{/gestao/atrasadas}"
            class="btn btn-sm btn-outline-secondary"
            >Atrasadas</a
          >
          <a
            th:if="${navEquipe}"
            th:href="@{/gestao/reavaliacao}"
            class="btn btn-sm btn-outline-secondary"
            >Reavaliação</a
          >

          <span class="vr mx-1 d-none d-md-block" th:if="${navAdmin}"></span>
          <a
            th:if="${navAdmin}"
            th:href="@{/admin/moderacao}"
            class="btn btn-sm btn-outline-danger"
            >Moderação</a
          >
          <a
            th:if="${navAdmin}"
            th:href="@{/admin/usuarios}"
            class="btn btn-sm btn-outline-danger"
            >Usuários</a
          >
          <a
            th:if="${navAdmin}"
            th:href="@{/admin/auditoria}"
            class="btn btn-sm btn-outline-danger"
            >Auditoria</a
          >
          <a
            th:if="${navAdmin}"
            th:href="@{/admin/unidades}"
            class="btn btn-sm btn-outline-danger"
            >Unidades</a
          >
          <a
            th:if="${navAdmin}"
            th:href="@{/admin/categorias}"
            class="btn btn-sm btn-outline-danger"
            >Prazos</a
          >

          <span class="vr mx-1 d-none d-md-block"></span>
          <a
            th:unless="${navLogado}"
            th:href="@{/login}"
            class="btn btn-sm btn-primary"
            >Entrar</a
          >
          <a
            th:unless="${navLogado}"
            th:href="@{/cadastro}"
            class="btn btn-sm btn-outline-primary"
            >Cadastrar</a
          >
          <form
            th:if="${navLogado}"
            th:action="@{/logout}"
            method="post"
            class="d-inline"
          >
            <button type="submit" class="btn btn-sm btn-outline-secondary">
              Sair
            </button>
          </form>
        </div>
      </div>
    </nav>
  </body>
</html>
