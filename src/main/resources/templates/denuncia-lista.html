<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <th:block
      th:replace="~{layout-fragmentos :: headComum('Filtros avançados')}"
    ></th:block>
  </head>
  <body>
    <div th:replace="~{layout-fragmentos :: topbar(true)}"></div>

    <div class="vp-grid vp-grid--2">
      <div th:replace="~{layout-fragmentos :: sidebar(true, '', '')}"></div>

      <main>
        <section class="vp-card vp-cab mb-3">
          <h1>Filtros avançados</h1>
          <p>
            Combine bairro, região, categoria, prioridade, situação e período.
          </p>

          <details th:attr="open=${filtro.temFiltros()} ? 'open'">
            <summary class="fw-semibold">Filtros e ordenação</summary>
            <form th:action="@{/denuncias}" method="get" class="mt-3">
              <div class="row g-2">
                <div class="col-sm-6">
                  <label for="f-bairro" class="form-label small mb-1"
                    >Bairro</label
                  >
                  <input
                    type="text"
                    id="f-bairro"
                    name="bairro"
                    maxlength="100"
                    class="form-control form-control-sm"
                    th:value="${filtro.bairro}"
                  />
                </div>
                <div class="col-sm-6">
                  <label for="f-regiao" class="form-label small mb-1"
                    >Região</label
                  >
                  <select
                    id="f-regiao"
                    name="regiao"
                    class="form-select form-select-sm"
                  >
                    <option value="">Todas</option>
                    <option
                      th:each="r : ${regioes}"
                      th:value="${r}"
                      th:text="${r}"
                      th:selected="${r == filtro.regiao}"
                    ></option>
                  </select>
                </div>
                <div class="col-sm-6">
                  <label for="f-categoria" class="form-label small mb-1"
                    >Categoria</label
                  >
                  <select
                    id="f-categoria"
                    name="categoriaId"
                    class="form-select form-select-sm"
                  >
                    <option value="">Todas</option>
                    <option
                      th:each="c : ${categorias}"
                      th:value="${c.id}"
                      th:text="${c.nome}"
                      th:selected="${filtro.categoriaId != null and filtro.categoriaId == c.id}"
                    ></option>
                  </select>
                </div>
                <div class="col-sm-6">
                  <label for="f-prioridade" class="form-label small mb-1"
                    >Prioridade</label
                  >
                  <select
                    id="f-prioridade"
                    name="prioridade"
                    class="form-select form-select-sm"
                  >
                    <option value="">Todas</option>
                    <option
                      th:each="p : ${prioridades}"
                      th:value="${p}"
                      th:text="${p}"
                      th:selected="${p == filtro.prioridade}"
                    ></option>
                  </select>
                </div>
                <div class="col-sm-6">
                  <label for="f-status" class="form-label small mb-1"
                    >Situação</label
                  >
                  <select
                    id="f-status"
                    name="status"
                    class="form-select form-select-sm"
                  >
                    <option value="">Todas</option>
                    <option
                      th:each="s : ${statuses}"
                      th:value="${s}"
                      th:text="${s.rotulo}"
                      th:selected="${s == filtro.status}"
                    ></option>
                  </select>
                </div>
                <div class="col-sm-6">
                  <label for="f-ordem" class="form-label small mb-1"
                    >Ordenar por</label
                  >
                  <select
                    id="f-ordem"
                    name="ordem"
                    class="form-select form-select-sm"
                  >
                    <option
                      th:each="o : ${ordens}"
                      th:value="${o}"
                      th:text="${o.rotulo}"
                      th:selected="${o == filtro.ordem}"
                    ></option>
                  </select>
                </div>
                <div class="col-6">
                  <label for="f-de" class="form-label small mb-1">De</label>
                  <input
                    type="date"
                    id="f-de"
                    name="de"
                    class="form-control form-control-sm"
                    th:value="${filtro.de}"
                  />
                </div>
                <div class="col-6">
                  <label for="f-ate" class="form-label small mb-1">Até</label>
                  <input
                    type="date"
                    id="f-ate"
                    name="ate"
                    class="form-control form-control-sm"
                    th:value="${filtro.ate}"
                  />
                </div>
              </div>
              <div class="mt-3 d-flex gap-2">
                <button type="submit" class="vp-btn vp-btn--pri">
                  Filtrar
                </button>
                <a th:href="@{/denuncias}" class="vp-btn">Limpar</a>
              </div>
              <div class="form-text mt-2">
                A prioridade considerada é a oficial, quando existir; senão, a
                sugerida pelo cidadão.
              </div>
            </form>
          </details>
        </section>

        <p
          class="text-muted small"
          th:text="${page.totalElements} + ' ocorrência(s) encontrada(s)'"
        >
          total
        </p>
        <p th:if="${page.empty}" class="text-muted">
          Nenhuma ocorrência encontrada.
        </p>

        <th:block th:each="d : ${page.content}">
          <article th:replace="~{layout-fragmentos :: cartao(${d}, ${contadores.get(d.id)}, ${fotos.get(d.id)}, ${curtidos.contains(d.id)}, ${incentivados.contains(d.id)}, ${'/denuncias?' + filtro.queryString(page.number)})}"></article>
        </th:block>

        <nav
          th:replace="~{layout-fragmentos :: paginacao(${page}, ${'/denuncias?' + filtro.queryString(page.number - 1)}, ${'/denuncias?' + filtro.queryString(page.number + 1)})}"
        ></nav>
      </main>
    </div>

    <script th:replace="~{layout-fragmentos :: copiar}"></script>
  </body>
</html>
