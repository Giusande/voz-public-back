<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrar ocorrência - Voz Pública</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4" style="max-width: 640px;">
    <h1 class="h3 mb-4">Registrar ocorrência</h1>

    <div class="alert alert-danger" th:if="${param.erroTamanho}">
        As fotos excedem o limite (5 MB por foto). Preencha o formulário novamente.
    </div>
    <div class="alert alert-danger" th:if="${erroFotos}" th:text="${erroFotos}"></div>

    <form th:action="@{/denuncias/nova}" th:object="${denunciaForm}" method="post"
          enctype="multipart/form-data" novalidate>

        <div class="mb-3">
            <label for="titulo" class="form-label">Título</label>
            <input type="text" id="titulo" th:field="*{titulo}" class="form-control"
                   th:classappend="${#fields.hasErrors('titulo')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{titulo}"></div>
        </div>

        <div class="mb-3">
            <label for="descricao" class="form-label">Descrição</label>
            <textarea id="descricao" th:field="*{descricao}" rows="5" class="form-control"
                      th:classappend="${#fields.hasErrors('descricao')} ? 'is-invalid'"></textarea>
            <div class="invalid-feedback" th:errors="*{descricao}"></div>
        </div>

        <div class="mb-3">
            <label for="categoriaId" class="form-label">Categoria</label>
            <select id="categoriaId" th:field="*{categoriaId}" class="form-select"
                    th:classappend="${#fields.hasErrors('categoriaId')} ? 'is-invalid'">
                <option value="">Selecione...</option>
                <option th:each="c : ${categorias}" th:value="${c.id}" th:text="${c.nome}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{categoriaId}"></div>
        </div>

        <div class="mb-3">
            <label for="endereco" class="form-label">Endereço (opcional)</label>
            <input type="text" id="endereco" th:field="*{endereco}" class="form-control"
                   th:classappend="${#fields.hasErrors('endereco')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{endereco}"></div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="bairro" class="form-label">Bairro</label>
                <input type="text" id="bairro" th:field="*{bairro}" class="form-control"
                       th:classappend="${#fields.hasErrors('bairro')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{bairro}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label for="regiao" class="form-label">Região</label>
                <select id="regiao" th:field="*{regiao}" class="form-select"
                        th:classappend="${#fields.hasErrors('regiao')} ? 'is-invalid'">
                    <option value="">Selecione...</option>
                    <option th:each="r : ${regioes}" th:value="${r}" th:text="${r}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{regiao}"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="latitude" class="form-label">Latitude (opcional)</label>
                <input type="number" step="any" id="latitude" th:field="*{latitude}" class="form-control"
                       th:classappend="${#fields.hasErrors('latitude')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{latitude}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label for="longitude" class="form-label">Longitude (opcional)</label>
                <input type="number" step="any" id="longitude" th:field="*{longitude}" class="form-control"
                       th:classappend="${#fields.hasErrors('longitude')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{longitude}"></div>
            </div>
        </div>

        <div id="similares" aria-live="polite" th:data-url="@{/denuncias/similares}"></div>

        <div class="mb-3">
            <label for="fotos" class="form-label">Fotos (opcional)</label>
            <input type="file" id="fotos" name="fotos" class="form-control"
                   accept="image/jpeg,image/png" multiple>
            <div class="form-text">Até 5 fotos JPEG ou PNG, de até 5 MB cada.</div>
        </div>

        <div class="mb-4">
            <label for="prioridadeSugerida" class="form-label">Prioridade sugerida</label>
            <select id="prioridadeSugerida" th:field="*{prioridadeSugerida}" class="form-select"
                    th:classappend="${#fields.hasErrors('prioridadeSugerida')} ? 'is-invalid'">
                <option th:each="p : ${prioridades}" th:value="${p}" th:text="${p}"></option>
            </select>
            <div class="form-text">É a sua sugestão. A prioridade oficial é definida pela administração.</div>
            <div class="invalid-feedback" th:errors="*{prioridadeSugerida}"></div>
        </div>

        <button type="submit" class="btn btn-primary">Registrar</button>
        <a th:href="@{/denuncias}" class="btn btn-link">Cancelar</a>
    </form>
</main>

<script>
    (function () {
        var alvo = document.getElementById('similares');
        var url = alvo.getAttribute('data-url');
        var campos = ['categoriaId', 'bairro', 'titulo', 'latitude', 'longitude'];
        var temporizador;

        function buscar() {
            var categoria = document.getElementById('categoriaId').value;
            if (!categoria) { alvo.innerHTML = ''; return; }

            var params = new URLSearchParams();
            campos.forEach(function (id) {
                var valor = document.getElementById(id).value.trim();
                if (valor) params.set(id, valor);
            });

            fetch(url + '?' + params.toString(), { credentials: 'same-origin' })
                .then(function (r) { return r.ok ? r.text() : ''; })
                .then(function (html) { alvo.innerHTML = html; })
                .catch(function () { alvo.innerHTML = ''; });
        }

        function agendar() {
            clearTimeout(temporizador);
            temporizador = setTimeout(buscar, 500);
        }

        campos.forEach(function (id) {
            var el = document.getElementById(id);
            el.addEventListener('input', agendar);
            el.addEventListener('change', agendar);
        });
        buscar(); // caso o formulário volte preenchido após um erro de validação
    })();
</script>
</body>
</html>
