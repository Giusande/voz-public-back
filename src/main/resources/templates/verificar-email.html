<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Confirmar e-mail - Voz Pública</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <div th:replace="~{menu-fragmento :: menu}"></div>
    <main class="container" style="max-width: 460px">
      <h1 class="h4 mb-3">Confirmar e-mail</h1>

      <div th:if="${valido}">
        <p>Clique no botão para confirmar o seu e-mail e ativar a conta.</p>
        <form th:action="@{/verificar-email}" method="post">
          <input type="hidden" name="token" th:value="${token}" />
          <button type="submit" class="btn btn-primary">
            Confirmar meu e-mail
          </button>
        </form>
      </div>

      <div class="alert alert-danger" th:if="${!valido}">
        Este link é inválido ou expirou.
        <a th:href="@{/verificar-email/reenviar}">Peça um novo link</a>.
      </div>
    </main>
  </body>
</html>
